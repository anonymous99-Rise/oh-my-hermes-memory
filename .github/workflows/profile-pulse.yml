name: profile-pulse

on:
  # 每天 UTC 00:00 跑一次 (= 北京时间 08:00)
  schedule:
    - cron: "0 0 * * *"

  # 支持手动触发 (Actions 页面 → Run workflow)
  workflow_dispatch:

  # 当脚本或 README 改动时也跑一次,方便测试
  push:
    paths:
      - ".github/workflows/profile-pulse.yml"
      - ".github/scripts/profile_pulse.py"
      - "README.md"

# 最低权限,只能写 README
permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # 必需:允许 workflow 推 commit 回同 repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: run pulse script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: anonymous99-Rise
          README_PATH: README.md
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKATIME_USER: anonymous99-Rise
        run: python .github/scripts/profile_pulse.py

      - name: commit if changed
        run: |
          git config user.name "profile-pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "no changes, skipping commit"
          else
            git add README.md
            git commit -m "pulse: refresh dynamic sections ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
